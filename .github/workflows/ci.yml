name: Spring Boot Gradle CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone repo
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Configure JDK with Gradle caching
      - name: Set up Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      # Step 3: Ensure Gradle wrapper script has execute permissions
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: Run tests and output individual test execution
      - name: Build and Test with Gradle
        run: ./gradlew test --info

      # Step 5: Save test reports if tests fail or succeed
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-results
          path: build/reports/tests/test/
          retention-days: 5